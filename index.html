<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bedrock Pack Maker</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
body{font-family:system-ui,sans-serif;background:#1b1d22;color:#eee;margin:0 auto;padding:16px;max-width:800px}
h1{color:#7fd16b}
fieldset{border:1px solid #444;border-radius:8px;margin:12px 0;padding:12px}
legend{color:#9be}
label{display:block;margin:6px 0}
input{background:#2a2d34;color:#eee;border:1px solid #555;border-radius:6px;padding:6px;margin:3px 0;width:100%;box-sizing:border-box}
input[type=checkbox]{width:auto}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;max-width:380px;margin:6px 0}
button{background:#3a8f3a;color:#fff;border:0;border-radius:6px;padding:10px 14px;cursor:pointer;margin:6px 0}
button.sec{background:#444}
.item{border:1px dashed #555;border-radius:6px;padding:8px;margin:8px 0}
#status{color:#9be}
</style>
</head>
<body>
<h1>Генератор Bedrock-паков</h1>

<fieldset><legend>Основное</legend>
<label>Название пака<input id="name" value="Мой пак"></label>
<label>Описание<input id="desc" value="Создано в генераторе"></label>
<label>Namespace (латиница, цифры, _)<input id="ns" value="mypack"></label>
<label>Версия (x.y.z)<input id="ver" value="1.0.0"></label>
<label><input type="checkbox" id="resPack" checked> Ресурс-пак (текстуры, названия)</label>
<label><input type="checkbox" id="behPack" checked> Бихевиор-пак (предметы, крафты)</label>
<label>Иконка пака (PNG, необязательно)<input type="file" id="packIcon" accept="image/png"></label>
</fieldset>

<fieldset><legend>Свои предметы</legend>
<div id="items"></div>
<button class="sec" onclick="addItem()">+ Предмет</button>
</fieldset>

<fieldset><legend>Крафты (сетка 3×3)</legend>
<div id="recipes"></div>
<button class="sec" onclick="addRecipe()">+ Крафт</button>
</fieldset>

<button onclick="build()">Скачать пак</button>
<p id="status"></p>

<script>
const $ = id => document.getElementById(id);
const sid = s => s.trim().toLowerCase().replace(/[^a-z0-9_]/g, '_');

function addItem() {
  const d = document.createElement('div');
  d.className = 'item';
  d.innerHTML = `
    <input placeholder="id предмета (например ruby)">
    <input placeholder="Название (Ruby)">
    <input type="file" accept="image/png">`;
  $('items').appendChild(d);
}

function addRecipe() {
  const d = document.createElement('div');
  d.className = 'item';
  d.innerHTML = `
    <label><input type="checkbox" class="sl"> Без порядка (shapeless)</label>
    <div class="grid">${'<input class="cell" placeholder="предмет">'.repeat(9)}</div>
    <input class="res" placeholder="Результат (stick или ns:ruby)">
    <input class="cnt" type="number" value="1" min="1" max="64">`;
  $('recipes').appendChild(d);
}

function readItems() {
  return [...$('items').children].map(d => {
    const [i, n, f] = d.querySelectorAll('input');
    return { id: sid(i.value), name: n.value || i.value, file: f.files[0] };
  }).filter(x => x.id);
}

function readRecipes() {
  return [...$('recipes').children].map(d => ({
    shapeless: d.querySelector('.sl').checked,
    cells: [...d.querySelectorAll('.cell')].map(c => c.value.trim()),
    result: d.querySelector('.res').value.trim(),
    count: parseInt(d.querySelector('.cnt').value) || 1
  })).filter(r => r.result && r.cells.some(Boolean));
}

function manifest(name, desc, uuid, modUuid, modType, ver, depUuid) {
  const m = {
    format_version: 2,
    header: { name, description: desc, uuid, version: ver, min_engine_version: [1, 20, 0] },
    modules: [{ type: modType, uuid: modUuid, version: ver }]
  };
  if (depUuid) m.dependencies = [{ uuid: depUuid, version: ver }];
  return m;
}

function recipeJSON(r, idx, ns, full) {
  const base = { description: { identifier: `${ns}:recipe_${idx}` }, tags: ['crafting_table'] };
  const result = { item: full(r.result), count: r.count };

  if (r.shapeless) {
    return { format_version: '1.20.0', 'minecraft:recipe_shapeless': {
      ...base,
      ingredients: r.cells.filter(Boolean).map(c => ({ item: full(c) })),
      result
    }};
  }

  const letters = 'ABCDEFGHI';
  const map = {};
  let k = 0;
  const pattern = [0, 1, 2].map(row => [0, 1, 2].map(col => {
    const v = r.cells[row * 3 + col];
    if (!v) return ' ';
    const it = full(v);
    if (!(it in map)) map[it] = letters[k++];
    return map[it];
  }).join(''));

  const key = {};
  for (const it in map) key[map[it]] = { item: it };

  return { format_version: '1.20.0', 'minecraft:recipe_shaped': {
    ...base, pattern, key, result
  }};
}

async function pack(entries) {
  const z = new JSZip();
  for (const [path, content] of entries) z.file(path, content);
  return z.generateAsync({ type: 'uint8array' });
}

async function build() {
  const status = $('status');
  status.textContent = 'Собираю...';
  try {
    const ns = sid($('ns').value) || 'mypack';
    const name = $('name').value || 'Pack';
    const desc = $('desc').value || '';
    const ver = $('ver').value.split('.').map(n => parseInt(n) || 0);
    while (ver.length < 3) ver.push(0);
    const version = ver.slice(0, 3);

    const wantR = $('resPack').checked;
    const wantB = $('behPack').checked;
    if (!wantR && !wantB) throw new Error('Выбери хотя бы один тип пака');

    const items = readItems();
    const customIds = new Set(items.map(i => i.id));
    const full = x => {
      x = x.trim().toLowerCase();
      if (x.includes(':')) return x;
      return customIds.has(sid(x)) ? `${ns}:${sid(x)}` : `minecraft:${sid(x)}`;
    };

    const RU = crypto.randomUUID(), RM = crypto.randomUUID();
    const BU = crypto.randomUUID(), BM = crypto.randomUUID();
    const icon = $('packIcon').files[0];
    const parts = [];

    if (wantR) {
      const e = [['manifest.json', JSON.stringify(manifest(name, desc, RU, RM, 'resources', version, wantB ? BU : null))]];
      if (icon) e.push(['pack_icon.png', icon]);
      e.push(['texts/languages.json', '["en_US"]']);
      e.push(['texts/en_US.lang', items.map(i => `item.${ns}:${i.id}.name=${i.name}`).join('\n')]);
      const tex = { resource_pack_name: ns, texture_name: 'atlas.items', texture_data: {} };
      for (const i of items) {
        if (!i.file) continue;
        e.push([`textures/items/${i.id}.png`, i.file]);
        tex.texture_data[i.id] = { textures: `textures/items/${i.id}` };
      }
      e.push(['textures/item_texture.json', JSON.stringify(tex, null, 1)]);
      parts.push(['resource.mcpack', await pack(e)]);
    }

    if (wantB) {
      const e = [['manifest.json', JSON.stringify(manifest(name, desc, BU, BM, 'data', version, wantR ? RU : null))]];
      if (icon) e.push(['pack_icon.png', icon]);
      for (const i of items) {
        e.push([`items/${i.id}.json`, JSON.stringify({
          format_version: '1.20.10',
          'minecraft:item': {
            description: { identifier: `${ns}:${i.id}`, category: 'items' },
            components: { 'minecraft:max_stack_size': 64, 'minecraft:icon': i.id }
          }
        }, null, 1)]);
      }
      readRecipes().forEach((r, k) => e.push([`recipes/recipe_${k}.json`, JSON.stringify(recipeJSON(r, k, ns, full), null, 1)]));
      parts.push(['behavior.mcpack', await pack(e)]);
    }

    const safe = name.replace(/[\\/:*?"<>|]/g, '_');
    let blob, fname;
    if (parts.length === 2) {
      blob = new Blob([await pack(parts)], { type: 'application/zip' });
      fname = safe + '.mcaddon';
    } else {
      blob = new Blob([parts[0][1]], { type: 'application/zip' });
      fname = safe + '.mcpack';
    }

    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = fname;
    a.click();
    status.textContent = `Готово: ${fname}`;
  } catch (err) {
    status.textContent = 'Ошибка: ' + err.message;
  }
}

// Стартовые примеры
addItem();
addRecipe();
</script>
</body>
  </html>
