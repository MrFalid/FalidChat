<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Чат</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.4 system-ui,sans-serif; background:#0e1116; color:#e6e6e6; transition:background .3s, color .3s; }
  body.dark { background:#05060a; color:#9aa0a6; }
  header { padding:10px 14px; background:#161b22; display:flex; gap:8px; align-items:center; border-bottom:1px solid #222; }
  body.dark header { background:#0a0b0f; border-color:#111; }
  header b { flex:1; }
  button { background:#2d333b; color:#e6e6e6; border:1px solid #444; border-radius:8px; padding:6px 10px; cursor:pointer; }
  button:active { transform:scale(.97); }
  #log { padding:12px; height:calc(100vh - 140px); overflow-y:auto; display:flex; flex-direction:column; gap:8px; }
  .msg { max-width:80%; padding:8px 10px; border-radius:12px; background:#1c2128; word-wrap:break-word; }
  body.dark .msg { background:#11131a; }
  .me { align-self:flex-end; background:#2a4b8d; }
  body.dark .me { background:#1b2f5a; }
  .bot { align-self:flex-start; background:#3a1f4a; border:1px solid #6a3a8a; }
  .meta { font-size:11px; opacity:.7; margin-bottom:3px; }
  .bot .meta { color:#d7a6ff; opacity:1; }
  .msg img, .msg video { max-width:220px; max-height:220px; border-radius:8px; display:block; margin-top:4px; }
  .msg .voice { width:220px; }
  footer { position:fixed; bottom:0; left:0; right:0; background:#161b22; border-top:1px solid #222; padding:8px; display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
  body.dark footer { background:#0a0b0f; border-color:#111; }
  footer input[type=text] { flex:1; min-width:120px; padding:8px; border-radius:8px; border:1px solid #333; background:#0e1116; color:#e6e6e6; }
  body.dark footer input[type=text] { background:#05060a; border-color:#222; }
  .attach { position:relative; overflow:hidden; }
  .attach input { position:absolute; inset:0; opacity:0; cursor:pointer; }
  .who { font-size:12px; opacity:.6; }
  .who.bot-on { color:#d7a6ff; opacity:1; }
  #login { position:fixed; inset:0; background:#0e1116; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:10px; z-index:10; }
  body.dark #login { background:#05060a; }
  #login input { padding:10px; border-radius:8px; border:1px solid #333; background:#161b22; color:#e6e6e6; font-size:16px; width:220px; }
  #err { color:#ff6b6b; font-size:13px; min-height:16px; }
  #profile { position:fixed; inset:0; background:rgba(0,0,0,.85); display:none; align-items:center; justify-content:center; z-index:20; }
  #profile .card { background:#161b22; border:1px solid #6a3a8a; padding:20px; border-radius:16px; max-width:320px; width:90%; text-align:center; }
  body.dark #profile .card { background:#0a0b0f; }
  @media (max-width:480px){ .msg{ max-width:90% } }
</style>
</head>
<body>

<div id="login">
  <h3>Введите имя (до 20 символов)</h3>
  <input id="nameIn" maxlength="20" placeholder="Ваше имя" autocomplete="off">
  <button id="joinBtn">Войти в чат</button>
  <div id="err"></div>
</div>

<header>
  <b id="title">Чат</b>
  <span class="who" id="who"></span>
  <button id="clearBtn">Очистить</button>
  <button id="exitBtn">Выйти</button>
</header>

<div id="log"></div>

<footer>
  <input type="text" id="textIn" placeholder="Сообщение…" maxlength="2000" autocomplete="off">
  <label class="attach"><button type="button">📎</button>
    <input type="file" id="fileIn" accept="image/*,video/*,audio/*">
  </label>
  <button id="sendBtn">➤</button>
</footer>

<div id="profile">
  <div class="card">
    <h3 style="margin-top:0">[bot] Крашер</h3>
    <div class="who" style="margin-bottom:12px">бот · публичный собеседник</div>
    <button id="profileBack">Выйти из профиля</button>
  </div>
</div>

<script>
// ==== настройки ====
const TOPIC = "public_chat_krasher_v1"; // уникальное имя публичной темы ntfy
const NTFY = "https://ntfy.sh";
const SID_KEY = "chat_sid";
const NAME_KEY = "chat_name";
const BOT_NAME = "[bot] Крашер";

// ==== состояние ====
let sid = localStorage.getItem(SID_KEY);
if (!sid) { sid = crypto.randomUUID(); localStorage.setItem(SID_KEY, sid); }

let name = "";
let since = 0;
let timer = null;
let clicksOnKrasher = 0;
let inKrasherChat = false;

const $ = (id) => document.getElementById(id);
const log = $("log"), err = $("err");

function nowMs() { return Date.now(); }

function addMsg(m) {
  const d = document.createElement("div");
  const isBot = m.name === BOT_NAME;
  d.className = "msg" + (m.name === name ? " me" : "") + (isBot ? " bot" : "");

  const meta = document.createElement("div");
  meta.className = "meta";
  const t = new Date(m.ts).toLocaleTimeString();
  meta.textContent = `${m.name} · ${t}`;
  d.appendChild(meta);

  if (m.text) {
    const p = document.createElement("div");
    p.textContent = m.text; // только textContent — без HTML
    d.appendChild(p);
  }

  if (m.file) {
    const url = m.file; // прямая ссылка ntfy на вложение
    if (m.type === "photo") {
      const img = document.createElement("img"); img.src = url; img.loading="lazy"; d.appendChild(img);
    } else if (m.type === "voice" || m.type === "audio") {
      const a = document.createElement("audio"); a.controls = true; a.className="voice"; a.src = url; d.appendChild(a);
    } else if (m.type === "video" || m.type === "video_note") {
      const v = document.createElement("video"); v.controls = true; v.src = url; d.appendChild(v);
    } else {
      const a = document.createElement("a"); a.href = url; a.textContent = "Файл"; a.target="_blank"; d.appendChild(a);
    }
  }

  // клики по Крашеру
  if (isBot) {
    d.style.cursor = "pointer";
    d.addEventListener("click", () => {
      clicksOnKrasher++;
      if (clicksOnKrasher >= 20) {
        clicksOnKrasher = 0;
        openProfile();
      }
    });
  }

  log.appendChild(d);
  log.scrollTop = log.scrollHeight;
}

function openProfile() {
  $("profile").style.display = "flex";
  document.body.classList.add("dark"); // мрачно
  inKrasherChat = true;
  $("title").textContent = "Чат с [bot] Крашер";
  $("who").textContent = "вы в чате Крашера";
  $("who").classList.add("bot-on");
}
function closeProfile() {
  $("profile").style.display = "none";
  document.body.classList.remove("dark");
  inKrasherChat = false;
  $("title").textContent = "Общий чат";
  $("who").textContent = name;
  $("who").classList.remove("bot-on");
}

$("profileBack").onclick = closeProfile;

function join() {
  const v = $("nameIn").value.trim().slice(0, 20);
  if (!v) { err.textContent = "Введите имя"; return; }
  name = v;
  localStorage.setItem(NAME_KEY, v);
  $("login").style.display = "none";
  $("who").textContent = name;
  $("title").textContent = "Общий чат";

  // подгружаем историю из ntfy (последние сообщения) и стартуем polling
  loadHistory();
  timer = setInterval(poll, 1500);
}

async function loadHistory() {
  try {
    const r = await fetch(`${NTFY}/${TOPIC}/json?poll=1&since=all`);
    if (!r.ok) return;
    const text = await r.text();
    const lines = text.split("\n").filter(Boolean);
    for (const line of lines) {
      try { handleNtfy(JSON.parse(line)); } catch(e){}
    }
  } catch(e){}
}

async function poll() {
  try {
    const r = await fetch(`${NTFY}/${TOPIC}/json?poll=1&since=${since}`);
    if (!r.ok) return;
    const text = await r.text();
    const lines = text.split("\n").filter(Boolean);
    for (const line of lines) {
      try { handleNtfy(JSON.parse(line)); } catch(e){}
    }
  } catch(e){}
}

function handleNtfy(msg) {
  if (!msg || msg.event !== "message") return;
  if (msg.time * 1000 <= since) return;
  since = Math.max(since, msg.time * 1000);

  // сообщения бота — все видят; обычные сообщения — тоже все видят,
  // но фильтр «писать можно только Крашеру» реализуем ниже в send()
  let data;
  try { data = JSON.parse(msg.message); } catch(e){ data = { text: msg.message, name: "anon", ts: msg.time*1000 }; }

  if (data.name === name && data.sid === sid) {
    // своё уже добавлено локально — пропускаем дубль
    return;
  }
  addMsg({
    name: String(data.name || "anon").slice(0,20),
    text: String(data.text || "").slice(0,2000),
    ts: data.ts || msg.time*1000,
    file: data.file || null,
    type: data.type || null,
  });
}

// rate-limit на клиенте (5 / 10 сек)
const sendTimes = [];
function rateOk() {
  const t = nowMs();
  while (sendTimes.length && t - sendTimes[0] > 10_000) sendTimes.shift();
  if (sendTimes.length >= 5) return false;
  sendTimes.push(t);
  return true;
}

async function uploadFile(file, type) {
  // ntfy принимает файл через PUT в топик с заголовком Filename
  const r = await fetch(`${NTFY}/${TOPIC}`, {
    method: "PUT",
    headers: {
      "Filename": file.name || "file",
      "X-Type": type,
    },
    body: file,
  });
  if (!r.ok) throw new Error("upload_failed");
  const j = await r.json();
  // j.attachment.url — прямая ссылка
  return j.attachment.url;
}

async function publish(obj) {
  // публикуем JSON-сообщение в топик
  const r = await fetch(`${NTFY}/${TOPIC}`, {
    method: "POST",
    headers: { "Content-Type": "text/plain; charset=utf-8" },
    body: JSON.stringify(obj),
  });
  if (!r.ok) throw new Error("publish_failed");
}

async function send(text, file, type) {
  if (!text && !file) return;

  // Писать можно только Крашеру:
  // если вы НЕ в чате Крашера — сообщение всё равно уходит в общий топик,
  // но по ТЗ все видят всех. "Писать только Крашеру" трактуем так:
  // в интерфейсе "ответ Крашеру" = упоминание @[bot] Крашер.
  const finalText = text || "";
  let fileUrl = null;

  if (file) {
    const max = type === "photo" ? 10*1024*1024 : type === "voice" ? 5*1024*1024 : 20*1024*1024;
    if (file.size > max) { alert("Файл слишком большой"); return; }
    try { fileUrl = await uploadFile(file, type); }
    catch(e){ alert("Не удалось загрузить файл"); return; }
  }

  const out = {
    sid,
    name,
    text: finalText.slice(0, 2000),
    ts: nowMs(),
    file: fileUrl,
    type: file ? type : null,
  };

  try { await publish(out); }
  catch(e){ alert("Ошибка отправки"); return; }

  // локально показать своё сразу
  addMsg({
    name: name,
    text: out.text,
    ts: out.ts,
    file: fileUrl,
    type: out.type,
  });
}

$("joinBtn").onclick = join;
$("nameIn").addEventListener("keydown", (e)=>{ if(e.key==="Enter") join(); });

$("sendBtn").onclick = async () => {
  if (!rateOk()) { alert("Слишком часто (макс 5 сообщений за 10 сек)"); return; }
  const t = $("textIn").value.trim();
  $("textIn").value = "";
  await send(t, null, null);
};
$("textIn").addEventListener("keydown", (e)=>{
  if (e.key === "Enter") { e.preventDefault(); $("sendBtn").click(); }
});

$("fileIn").onchange = async (e) => {
  if (!rateOk()) { alert("Слишком часто"); e.target.value=""; return; }
  const f = e.target.files[0];
  if (!f) return;
  let type = "photo";
  if (f.type.startsWith("video/")) type = "video";
  else if (f.type.startsWith("audio/")) type = "voice";
  await send("", f, type);
  e.target.value = "";
};

$("clearBtn").onclick = () => {
  if (!confirm("Очистить локальную копию чата?")) return;
  log.innerHTML = "";
  since = 0;
};

$("exitBtn").onclick = () => {
  if (!confirm("Выйти из чата?")) return;
  clearInterval(timer);
  localStorage.removeItem(SID_KEY);
  localStorage.removeItem(NAME_KEY);
  location.reload();
};

// автоподстановка имени
if (localStorage.getItem(NAME_KEY)) {
  $("nameIn").value = localStorage.getItem(NAME_KEY);
}
</script>
</body>
  </html>
