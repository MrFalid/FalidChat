<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Мои конспекты</title>
<style>
  :root { --accent:#4f46e5; --bg:#f5f6fa; --card:#fff; --text:#1f2937; --muted:#6b7280; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, sans-serif; background:var(--bg); color:var(--text); }
  header { background:var(--accent); color:#fff; padding:20px; text-align:center; }
  header h1 { margin:0; font-size:1.6rem; }
  main { max-width:1100px; margin:0 auto; padding:20px; }

  .form { background:var(--card); padding:16px; border-radius:12px; margin-bottom:24px;
          display:grid; grid-template-columns:1fr 1fr; gap:12px; box-shadow:0 1px 4px rgba(0,0,0,.08); }
  .form label { font-size:13px; color:var(--muted); display:grid; gap:4px; }
  .form .full { grid-column:1 / -1; }
  input, select { padding:9px 10px; border:1px solid #d1d5db; border-radius:8px; font-size:15px; width:100%; }
  .btns { display:flex; gap:10px; flex-wrap:wrap; }
  button { padding:9px 14px; border:0; border-radius:8px; background:var(--accent); color:#fff; cursor:pointer; font-size:15px; }
  button.secondary { background:#e5e7eb; color:var(--text); }
  .note { font-size:13px; color:var(--muted); margin:0; }

  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(200px, 1fr)); gap:16px; }
  .card { background:var(--card); border-radius:12px; overflow:hidden; box-shadow:0 1px 4px rgba(0,0,0,.08); display:flex; flex-direction:column; }
  .cover { aspect-ratio:3/4; background:#e0e7ff; color:var(--accent); display:flex; align-items:center; justify-content:center; font-size:3rem; font-weight:bold; overflow:hidden; }
  .cover img { width:100%; height:100%; object-fit:cover; }
  .card-body { padding:12px; display:flex; flex-direction:column; gap:10px; flex:1; }
  .card-body h3 { margin:0; font-size:1rem; line-height:1.3; }
  .card-body button { margin-top:auto; }

  .modal { position:fixed; inset:0; background:rgba(0,0,0,.85); display:none; flex-direction:column; z-index:10; }
  .modal.open { display:flex; }
  .modal-bar { display:flex; justify-content:space-between; align-items:center; gap:10px; padding:10px 16px; background:#111; color:#fff; flex-wrap:wrap; }
  .modal-bar a { color:#fff; }
  .modal iframe { flex:1; border:0; background:#fff; }

  @media (max-width:600px) { .form { grid-template-columns:1fr; } }
</style>
</head>
<body>

<header><h1>Мои конспекты</h1></header>

<main>
  <div class="form">
    <label class="full">Название
      <input id="title" placeholder="Например: Лекция 1. Введение">
    </label>

    <label>Файл PDF (выбрать из репозитория)
      <select id="pdfSelect"></select>
    </label>
    <label>Или путь / ссылка на PDF
      <input id="pdfInput" placeholder="konspekt1.pdf или https://...">
    </label>

    <label>Обложка (выбрать из репозитория)
      <select id="coverSelect"></select>
    </label>
    <label>Или путь / ссылка на обложку (необязательно)
      <input id="coverInput" placeholder="obl1.jpg или https://...">
    </label>

    <div class="full btns">
      <button id="addBtn">Добавить карточку</button>
      <button class="secondary" id="copyBtn">Скопировать JSON для materials.json</button>
      <button class="secondary" id="resetBtn">Удалить добавленные здесь</button>
    </div>
    <p class="note full">Карточки, добавленные через форму, сохраняются только в этом браузере. Чтобы их увидели все, нажмите «Скопировать JSON» и вставьте текст в materials.json в репозитории.</p>
  </div>

  <div class="grid" id="grid"></div>
</main>

<div class="modal" id="viewer">
  <div class="modal-bar">
    <span id="viewerTitle"></span>
    <span class="btns">
      <a id="viewerOpen" target="_blank" rel="noopener">Открыть в новой вкладке</a>
      <button class="secondary" id="closeBtn">Закрыть</button>
    </span>
  </div>
  <iframe id="viewerFrame" title="Просмотр PDF"></iframe>
</div>

<script>
  // ===== НАСТРОЙКИ =====
  const CONFIG = {
    owner: "MrFalid",   // логин на GitHub
    repo: "FalidGdz",   // название репозитория
    folder: ""          // папка с файлами; пусто = корень
  };

  const LOCAL_KEY = "konspekty_local";
  let baseMaterials = [];

  const $ = id => document.getElementById(id);

  function getLocal() {
    try { return JSON.parse(localStorage.getItem(LOCAL_KEY)) || []; }
    catch { return []; }
  }
  function setLocal(list) {
    localStorage.setItem(LOCAL_KEY, JSON.stringify(list));
  }

  async function loadBase() {
    try {
      const r = await fetch("materials.json?v=" + Date.now());
      baseMaterials = await r.json();
    } catch (e) {
      baseMaterials = [];
      console.error("Не удалось загрузить materials.json", e);
    }
  }

  // Список PDF и картинок из репозитория через GitHub API
  async function loadRepoFiles() {
    const pdfSel = $("pdfSelect"), coverSel = $("coverSelect");
    pdfSel.innerHTML = '<option value="">— выбрать PDF —</option>';
    coverSel.innerHTML = '<option value="">— выбрать обложку —</option>';

    try {
      const path = CONFIG.folder ? "/" + CONFIG.folder : "";
      const r = await fetch(`https://api.github.com/repos/${CONFIG.owner}/${CONFIG.repo}/contents${path}`);
      const files = await r.json();
      files.forEach(f => {
        if (f.type !== "file") return;
        const name = f.name.toLowerCase();
        const rel = (CONFIG.folder ? CONFIG.folder + "/" : "") + f.name;
        if (name.endsWith(".pdf")) pdfSel.add(new Option(f.name, rel));
        if (/\.(png|jpe?g|webp|gif)$/.test(name)) coverSel.add(new Option(f.name, rel));
      });
    } catch (e) {
      console.error("Не удалось получить список файлов", e);
    }
  }

  function render() {
    const grid = $("grid");
    grid.innerHTML = "";
    const list = [...baseMaterials, ...getLocal()];

    list.forEach(m => {
      const card = document.createElement("div");
      card.className = "card";

      const cover = document.createElement("div");
      cover.className = "cover";
      if (m.cover) {
        const img = document.createElement("img");
        img.src = m.cover;
        img.alt = m.title;
        img.loading = "lazy";
        cover.appendChild(img);
      } else {
        cover.textContent = (m.title || "PDF").trim().charAt(0).toUpperCase();
      }

      const body = document.createElement("div");
      body.className = "card-body";
      const h = document.createElement("h3");
      h.textContent = m.title;
      const btn = document.createElement("button");
      btn.textContent = "Открыть";
      btn.onclick = () => openViewer(m);

      body.append(h, btn);
      card.append(cover, body);
      grid.appendChild(card);
    });
  }

  function openViewer(m) {
    $("viewerTitle").textContent = m.title;
    $("viewerFrame").src = m.pdf;
    $("viewerOpen").href = m.pdf;
    $("viewer").classList.add("open");
  }

  function closeViewer() {
    $("viewer").classList.remove("open");
    $("viewerFrame").src = "";
  }

  $("pdfSelect").onchange = e => $("pdfInput").value = e.target.value;
  $("coverSelect").onchange = e => $("coverInput").value = e.target.value;

  $("addBtn").onclick = () => {
    const title = $("title").value.trim();
    const pdf = $("pdfInput").value.trim();
    const cover = $("coverInput").value.trim();
    if (!title || !pdf) { alert("Заполните название и укажите PDF"); return; }

    const item = { title, pdf };
    if (cover) item.cover = cover;
    setLocal([...getLocal(), item]);

    $("title").value = "";
    $("pdfInput").value = "";
    $("coverInput").value = "";
    $("pdfSelect").value = "";
    $("coverSelect").value = "";
    render();
  };

  $("copyBtn").onclick = async () => {
    const local = getLocal();
    if (!local.length) { alert("Сначала добавьте карточку"); return; }
    const text = JSON.stringify(local, null, 2).slice(1, -1).trim();
    try {
      await navigator.clipboard.writeText(text);
      alert("Скопировано. Вставьте внутрь [ ] в materials.json, добавив запятую после последнего элемента.");
    } catch {
      prompt("Скопируйте текст вручную:", text);
    }
  };

  $("resetBtn").onclick = () => {
    if (confirm("Удалить карточки, добавленные в этом браузере?")) {
      localStorage.removeItem(LOCAL_KEY);
      render();
    }
  };

  $("closeBtn").onclick = closeViewer;
  $("viewer").addEventListener("click", e => { if (e.target.id === "viewer") closeViewer(); });

  (async function init() {
    await loadBase();
    await loadRepoFiles();
    render();
  })();
</script>
</body>
  </html>
